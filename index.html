<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1e2" id="metaThemeColor">
<title>忆 · Memory HSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TOKENS & COULEURS
  ============================================================ */
  :root{
    --bg:#eef1e2;
    --bg-wash-1: rgba(31,138,110,.14);
    --bg-wash-2: rgba(200,16,46,.10);
    --bg-wash-3: rgba(200,150,30,.16);
    --panel: rgba(255,253,246,.86);
    --panel-2: #fbf7ea;
    --card-bg:#fffdf7;
    --card-face:#fff8ea;
    --card-back-bg: #e5dbc4;
    --card-front-bg: #fffeea;
    --ink:#2c2826; 
    --ink-soft:#766c5c;
    --border:#e2d7bd;
    --border-soft: rgba(36,31,25,.07);

    --gold:#b9821a;
    --gold-soft:#8a5e0d;
    --jade:#1f8a6e;
    --jade-soft:#0f5f49;
    --cinnabar:#c8102e;
    --cinnabar-soft:#8f0b21;

    --accent: var(--jade);
    --accent-strong: var(--jade-soft);
    --on-accent: #ffffff;
    --correct: var(--jade);
    --incorrect: var(--cinnabar);

    --shadow-sm: 0 2px 6px rgba(90,60,20,.12);
    --shadow-md: 0 10px 22px rgba(90,60,20,.14);
    --shadow-lg: 0 22px 44px rgba(90,60,20,.20), 0 6px 14px rgba(90,60,20,.10);
    --shadow-panel: 0 20px 40px rgba(90,60,20,.16), inset 0 1px 0 rgba(255,255,255,.6);

    --hsk1:#3fae67; --hsk2:#3f8ecb; --hsk3:#d9b23c; --hsk4:#d98a2f; --hsk5:#c9578f; --hsk6:#b0453a; --hsk7:#9457a8;

    --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
    
    --font-display: 'KaiTi', 'STKaiti', 'Kaiti SC', 'Noto Serif SC', serif;
    --font-ui: 'Plus Jakarta Sans', 'Inter', sans-serif;

    --game-board-size: min(100%, calc(100dvh - 250px));
  }

  html[data-theme="dark"]{
    --bg:#121014;
    --bg-wash-1: rgba(201,162,74,.10);
    --bg-wash-2: rgba(95,168,137,.08);
    --bg-wash-3: rgba(193,80,60,.08);
    --panel:#1b1820;
    --panel-2:#221e27;
    --card-bg:#241f28;
    --card-face:#2a2430;
    --card-back-bg: #18141c;
    --card-front-bg: #2d2633;
    --ink:#f3ead6;
    --ink-soft:#a89f8e;
    --border:#342d38;
    --border-soft: rgba(255,255,255,.06);

    --gold:#c9a24a;
    --gold-soft:#e8cf8a;
    --jade:#5fa889;
    --jade-soft:#8fc7ab;
    --cinnabar:#c1503c;
    --cinnabar-soft:#dd8770;

    --accent: var(--gold);
    --accent-strong: var(--gold-soft);
    --on-accent: #1b1610;
    --correct: var(--jade);
    --incorrect: var(--cinnabar);

    --shadow-sm: 0 2px 6px rgba(0,0,0,.35);
    --shadow-md: 0 10px 24px rgba(0,0,0,.45);
    --shadow-lg: 0 24px 50px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.35);
    --shadow-panel: 0 20px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }
  body{
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    height:100dvh;
    overflow:hidden;
    position:relative;
    transition: background .35s ease, color .35s ease;
  }

  body::before{
    content:"";
    position:fixed; inset:-10%;
    background:
      radial-gradient(circle at 12% 8%, var(--bg-wash-1), transparent 42%),
      radial-gradient(circle at 88% 14%, var(--bg-wash-3), transparent 40%),
      radial-gradient(circle at 30% 95%, var(--bg-wash-2), transparent 45%);
    pointer-events:none; z-index:0;
    transition: opacity .4s ease;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none; z-index:0; opacity:.5; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  }
  html[data-theme="light"] body::after{ opacity:.35; }

  ::selection{ background: var(--accent); color: var(--on-accent); }

  .hanzi{ font-family: var(--font-display); font-weight: 700; }

  /* ============================================================
     THEME TOGGLE
  ============================================================ */
  .theme-toggle{
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    z-index: 500;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: var(--accent);
    transition: transform .25s ease, box-shadow .25s ease, background .3s ease;
  }
  .theme-toggle:hover{ transform: translateY(-2px) rotate(12deg); box-shadow: var(--shadow-md); }
  .theme-toggle svg{ width:20px; height:20px; }
  .theme-toggle .i-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .i-sun{ display:block; }
  html[data-theme="light"] .theme-toggle .i-moon{ display:none; }

  /* ============================================================
     BADGES HSK & PINYIN
  ============================================================ */
  .hsk-tag{
    display:inline-flex; align-items:center; justify-content:center;
    padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 800; letter-spacing:.4px;
    color:#fff !important; text-transform:uppercase; flex-shrink:0; line-height:1.2;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .hsk-tag.lvl-1{ background: var(--hsk1); } .hsk-tag.lvl-2{ background: var(--hsk2); }
  .hsk-tag.lvl-3{ background: var(--hsk3); } .hsk-tag.lvl-4{ background: var(--hsk4); }
  .hsk-tag.lvl-5{ background: var(--hsk5); } .hsk-tag.lvl-6{ background: var(--hsk6); }
  .hsk-tag.lvl-7{ background: var(--hsk7); }

  .py-syl{ font-weight:600; }
  .py-syl.tone1{ color:#c1503c; } .py-syl.tone2{ color:#c9902f; }
  .py-syl.tone3{ color:#3f9d5f; } .py-syl.tone4{ color:#3f7fc9; }
  .py-syl.tone5{ color: var(--ink-soft); font-weight:500;}
  html[data-theme="light"] .py-syl.tone1{ color:#c8102e; }
  html[data-theme="light"] .py-syl.tone2{ color:#b9821a; }
  html[data-theme="light"] .py-syl.tone3{ color:#1f8a6e; }
  html[data-theme="light"] .py-syl.tone4{ color:#2e5fa6; }

  /* ============================================================
     ECRANS
  ============================================================ */
  .screen{ display:none; height:100%; height:100dvh; padding: 14px; padding-top: max(14px, env(safe-area-inset-top));
    flex-direction:column; align-items:center; position:relative; z-index:1; }
  .screen.active{ display:flex; }
  #setupScreen{ overflow-y:auto; justify-content:flex-start; scrollbar-width:thin; }
  #setupScreen::-webkit-scrollbar{ width:6px; }
  #setupScreen::-webkit-scrollbar-thumb{ background: var(--border); border-radius:4px; }

  .brand{ display:flex; flex-direction:column; align-items:center; gap:4px; margin: 6px 0 18px; text-align:center; }
  .brand-seal{
    width:52px; height:52px; border-radius:14px;
    background: linear-gradient(155deg, var(--cinnabar), var(--cinnabar-soft));
    display:flex; align-items:center; justify-content:center;
    color:#fff8ea; font-family: var(--font-display); font-weight:900; font-size:26px;
    box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.25);
    transform: rotate(-4deg); margin-bottom:6px;
  }
  .brand-eyebrow{ font-size:11.5px; letter-spacing:2.5px; text-transform:uppercase; color: var(--accent); font-weight:700; }
  .brand h1{ font-family: var(--font-display); font-size: clamp(26px,6vw,34px); font-weight:900; color: var(--ink); }
  .brand h1 .accent-word{ color: var(--accent); }

  .status-chips{ display:flex; gap:8px; margin-bottom:16px; justify-content:center; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:6px;
    padding: 6px 12px; border-radius:20px; font-size:11.5px; font-weight:600;
    background: var(--panel-2); border:1px solid var(--border); color: var(--ink-soft);
  }
  .chip::before{ content:""; width:6px; height:6px; border-radius:50%; background: var(--ink-soft); flex-shrink:0; }
  .chip.ready{ color: var(--correct); border-color: color-mix(in srgb, var(--correct) 45%, transparent); background: color-mix(in srgb, var(--correct) 12%, var(--panel-2)); }
  .chip.ready::before{ background: var(--correct); }
  .chip.error{ color: var(--incorrect); border-color: color-mix(in srgb, var(--incorrect) 45%, transparent); background: color-mix(in srgb, var(--incorrect) 12%, var(--panel-2)); }
  .chip.error::before{ background: var(--incorrect); }

  .panel{
    background: var(--panel); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 22px; width:100%; max-width: 640px;
    box-shadow: var(--shadow-panel); margin-bottom: 14px;
  }

  .section-label{
    display:flex; align-items:center; gap:8px;
    font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
    color: var(--accent); margin-bottom:14px;
  }
  .section-label svg{ width:15px; height:15px; }
  .section-label::after{ content:""; flex:1; height:1px; background: var(--border); }

  .settings-grid{ display:grid; grid-template-columns: 1fr; gap:16px; }
  @media (min-width: 640px){ .settings-grid{ grid-template-columns: 1fr 1fr; column-gap: 18px; } .full-span{ grid-column: 1 / -1; } }

  .form-group label{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color: var(--ink-soft); margin-bottom:7px; font-weight:700; letter-spacing:.2px; }

  select{
    width:100%; padding: 11px 38px 11px 13px; border-radius: var(--r-md);
    background: var(--card-bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23c9a24a' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;
    background-size: 13px; border: 1px solid var(--border); color: var(--ink);
    font-family: var(--font-ui); font-size:14px; font-weight:600; outline:none;
    appearance:none; -webkit-appearance:none; cursor:pointer; transition: border-color .2s ease;
  }
  select:hover, select:focus{ border-color: var(--accent); }
  input[type="file"]{ width:100%; padding:9px; border-radius: var(--r-md); background: var(--card-bg); border:1px solid var(--border); color: var(--ink-soft); font-size:12.5px; }

  .slider-container{ display:flex; align-items:center; gap:12px; }
  .slider-val{ min-width:64px; text-align:right; font-weight:800; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"]{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:4px; background: var(--border); outline:none; cursor:pointer; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: var(--shadow-sm); }

  .hsk-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(64px,1fr)); gap:7px; }
  .btn-hsk{
    position:relative; padding: 9px 4px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--card-bg); color: var(--ink-soft); cursor:pointer; font-weight:800; font-size:12px;
    transition: .18s ease; font-family: var(--font-ui);
  }
  .btn-hsk::before{ content:""; position:absolute; left:8px; right:8px; bottom:5px; height:3px; border-radius:2px; background: var(--lvl-color, var(--accent)); opacity:0; transition:opacity .18s ease; }
  .btn-hsk[data-lvl="1"]{ --lvl-color: var(--hsk1); } .btn-hsk[data-lvl="2"]{ --lvl-color: var(--hsk2); }
  .btn-hsk[data-lvl="3"]{ --lvl-color: var(--hsk3); } .btn-hsk[data-lvl="4"]{ --lvl-color: var(--hsk4); }
  .btn-hsk[data-lvl="5"]{ --lvl-color: var(--hsk5); } .btn-hsk[data-lvl="6"]{ --lvl-color: var(--hsk6); }
  .btn-hsk[data-lvl="7"]{ --lvl-color: var(--hsk7); }
  .btn-hsk:hover{ border-color: var(--lvl-color, var(--accent)); color: var(--ink); }
  .btn-hsk.active{ border-color: var(--lvl-color, var(--accent)); background: color-mix(in srgb, var(--lvl-color, var(--accent)) 16%, var(--card-bg)); color: var(--ink); }
  .btn-hsk.active::before{ opacity:1; }

  .checkbox-wrap{ display:flex; align-items:center; gap:10px; background: var(--card-bg); padding:12px; border-radius: var(--r-md); border:1px solid var(--border); cursor:pointer; font-size:13px; font-weight:600; transition: border-color .2s; }
  .checkbox-wrap:hover{ border-color: var(--accent); }
  .checkbox-wrap input{ width:19px; height:19px; accent-color: var(--accent); cursor:pointer; flex-shrink:0; }

  .capacity-hint{ font-size:11.5px; margin-top:8px; color: var(--ink-soft); display:flex; align-items:center; gap:6px; min-height:16px; }
  .capacity-hint.ok{ color: var(--correct); font-weight:700; }
  .capacity-hint.bad{ color: var(--incorrect); font-weight:700; }

  .btn{
    width:100%; padding:14px; border-radius: var(--r-md); border:none;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: var(--on-accent); font-size:15px; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
    box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 45%, transparent);
    font-family: var(--font-ui);
  }
  .btn svg{ width:17px; height:17px; }
  .btn:hover:not(:disabled){ transform: translateY(-2px); filter: brightness(1.06); }
  .btn:active:not(:disabled){ transform: translateY(0); }
  .btn:disabled{ background: var(--border); color: var(--ink-soft); cursor:not-allowed; box-shadow:none; }
  .btn-secondary{ background: var(--panel-2); color: var(--ink); border:1px solid var(--border); box-shadow:none; }
  .btn-secondary:hover:not(:disabled){ border-color: var(--accent); background: var(--card-bg); filter:none; }

  #btnStart { max-width: 640px; margin: 0 auto; }

  /* ============================================================
     JEU — STRUCTURE UNIFIÉE PC & MOBILE
  ============================================================ */
  #gameScreen{ max-width:720px; width:100%; margin:0 auto; display:none; flex-direction:column; height:100%; height:100dvh; overflow:hidden; justify-content: center; padding: 10px 0;}
  #gameScreen.active{ display:flex; }

  /* BANDEAU DES COMPTEURS */
  .game-header{
    flex-shrink:0; background: var(--panel); border:1px solid var(--border); border-radius: var(--r-md);
    padding: 12px 18px; box-shadow: var(--shadow-sm);
    width: var(--stage-width, min(100%, calc(100dvh - 280px))); max-width:620px; margin: 0 auto 12px;
    display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 12px;
  }
  .game-stat{ display:flex; flex-direction:row; align-items:baseline; justify-content:center; gap:6px; flex:1; white-space:nowrap; position:relative; }
  .game-stat + .game-stat::before{ content:""; position:absolute; left:0; top:15%; bottom:15%; width:1px; background: var(--border); }
  .game-stat .stat-label{ font-size:11px; color: var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
  .game-stat .stat-value{ font-size:17px; font-weight:800; color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--font-ui); }

  /* PANNEAU DE RÉVÉLATION (Pinyin à gauche, Tag HSK à droite) */
  .reveal-panel{
    flex-shrink:0; min-height: 85px; height:auto;
    width: var(--stage-width, min(100%, calc(100dvh - 280px))); max-width:620px; margin: 0 auto 16px;
    background: var(--panel); border: 1.5px solid var(--border); border-radius: var(--r-md);
    box-shadow: var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; padding: 12px 20px;
    opacity: 0; transform: translateY(-6px) scale(.98);
    pointer-events:none;
    transition: opacity .28s cubic-bezier(.2,.9,.3,1), transform .28s cubic-bezier(.2,.9,.3,1), border-color .28s, box-shadow .28s, width .2s ease;
  }
  .reveal-panel.active{
    opacity:1; transform: translateY(0) scale(1); pointer-events:auto;
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    box-shadow: var(--shadow-md), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .reveal-inner{ width:100%; display:flex; flex-direction:column; gap:6px; text-align:center; }
  .reveal-head{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
  .reveal-hanzi{ font-size:32px; color: var(--ink); line-height:1; font-weight:900; }
  .reveal-meta{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .reveal-pinyin{ font-size:18px; font-weight:600; letter-spacing:.2px; display:inline-flex; align-items:center; }
  .reveal-def{ font-size:15px; color: var(--ink-soft); line-height:1.45; margin-top:2px; }

  .board-wrapper{
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding: 0;
  }

  /* GRILLE STRICTEMENT CARRÉE */
  .board{
    display:grid; gap:8px;
    width: var(--stage-width, min(100%, calc(100dvh - 280px)));
    height: var(--stage-width, min(100%, calc(100dvh - 280px)));
    max-width:620px; max-height:620px;
    aspect-ratio: 1 / 1 !important;
    perspective: 1200px;
  }

  .grid-3x3{ grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap:10px; }
  .grid-4x4{ grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap:8px; }
  .grid-5x5{ grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap:6px; }
  .grid-6x6{ grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap:5px; }
  .grid-8x8{ grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap:3px; }

  /* FOOTER */
  .game-footer{ 
    flex-shrink:0; display:flex; gap:12px; 
    width: var(--stage-width, min(100%, calc(100dvh - 280px))); max-width:620px; margin: 16px auto max(16px, env(safe-area-inset-bottom)); 
  }
  .game-footer .btn{ flex: 1; padding:12px 4px; font-size:14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ============================================================
     CARTES
  ============================================================ */
  .card{
    position:relative; width:100%; height:100%; cursor:pointer;
    perspective: 1200px;
    aspect-ratio: 1 / 1;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.34,1.15,.32,1);
  }
  .card:active .card-inner{ transform: scale(.95); }
  .card.flipped .card-inner{ transform: rotateY(180deg); }

  .card-face{
    position:absolute; inset:0; width:100%; height:100%;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2px;
  }

  .card-front{
    transform: rotateY(0deg);
    background: linear-gradient(135deg, var(--card-back-bg), var(--card-face));
    border: 1.5px solid color-mix(in srgb, var(--gold) 45%, var(--border));
    box-shadow: 0 3px 6px rgba(0,0,0,.25), inset 0 0 0 3px var(--card-bg), inset 0 0 0 5px color-mix(in srgb, var(--gold) 55%, transparent);
  }
  .card-front::after {
    content: "忆";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: clamp(34px, 55%, 72px);
    color: var(--gold);
    opacity: 0.38;
    font-weight: 700;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .card:hover .card-front{
    box-shadow: 0 6px 12px rgba(0,0,0,.3), inset 0 0 0 3px var(--card-bg), inset 0 0 0 5px color-mix(in srgb, var(--gold) 85%, transparent);
  }

  .grid-3x3 .card-back { --base-font: clamp(32px, 10vw, 64px); }
  .grid-4x4 .card-back { --base-font: clamp(24px, 7vw, 48px); }
  .grid-5x5 .card-back { --base-font: clamp(18px, 5.5vw, 34px); }
  .grid-6x6 .card-back { --base-font: clamp(15px, 4.5vw, 28px); }
  .grid-8x8 .card-back { --base-font: clamp(11px, 3.5vw, 20px); }

  .card-back{
    transform: rotateY(180deg);
    background: linear-gradient(135deg, var(--card-front-bg), var(--card-bg));
    color: var(--ink);
    border: 1.5px solid var(--border);
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    white-space: nowrap;
    font-family: var(--font-display); 
    font-weight: 700;
    font-size: var(--base-font);
  }

  .card-back.len-2 { font-size: calc(var(--base-font) * 0.75); }
  .card-back.len-3 { font-size: calc(var(--base-font) * 0.55); }
  .card-back.len-4 { font-size: calc(var(--base-font) * 0.40); }
  .card-back.len-long { font-size: calc(var(--base-font) * 0.32); }

  .card.empty-trap .card-back{
    background: linear-gradient(150deg, color-mix(in srgb, var(--incorrect) 15%, var(--card-front-bg)), var(--card-bg));
    border-color: var(--incorrect); color: var(--incorrect);
  }

  .card.matched .card-inner .card-back{
    background: linear-gradient(135deg, var(--card-front-bg), var(--card-bg));
    border-color: var(--correct);
    border-width: 2.5px;
    color: var(--ink);
    box-shadow: 0 4px 8px rgba(0,0,0,.1), inset 0 0 0 2px color-mix(in srgb, var(--correct) 35%, transparent);
    cursor: default;
  }
  .card.matched:hover .card-inner {
    transform: rotateY(180deg) translateY(-4px) scale(1.035);
  }

  @keyframes shakeBoard{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px);} 40%{ transform:translateX(8px);}
    60%{ transform:translateX(-4px);} 80%{ transform:translateX(4px);}
  }
  .shake{ animation: shakeBoard .5s ease-in-out; }

  /* ============================================================
     MODALS
  ============================================================ */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(10,8,6,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display:none; align-items:center; justify-content:center; z-index:1000;
    padding:14px; opacity:0; transition: opacity .22s ease;
  }
  .modal-overlay.active{ display:flex; opacity:1; }

  .modal-content{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--r-xl);
    padding:22px; width:100%; max-width:500px; box-shadow: var(--shadow-lg);
    max-height:85dvh; display:flex; flex-direction:column;
    transform: translateY(10px) scale(.98); animation: modalIn .28s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes modalIn{ to{ transform: translateY(0) scale(1); } }
  .modal-content.victory{ border-color: var(--gold); box-shadow: var(--shadow-lg), 0 0 0 4px color-mix(in srgb, var(--gold) 20%, transparent); }

  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-shrink:0; gap:10px; }
  .modal-title{ font-size:18px; font-weight:800; min-height:24px; font-family: var(--font-ui); }
  .modal-close{ background: var(--panel-2); border:1px solid var(--border); color: var(--ink-soft); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; transition:.2s; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover{ color: var(--incorrect); border-color: var(--incorrect); }

  .quiz-target{ text-align:center; font-size:50px; margin-bottom:4px; color: var(--accent); flex-shrink:0; font-family: var(--font-display); }
  .quiz-subtitle{ text-align:center; color: var(--ink-soft); margin-bottom:16px; font-size:13px; flex-shrink:0; font-weight:600; }
  .quiz-options{ display:flex; flex-direction:column; gap:9px; overflow-y:auto; padding-right:2px; }

  .quiz-btn{
    background: var(--card-bg); border:1.5px solid var(--border); color: var(--ink);
    padding:13px; border-radius: var(--r-md); font-size:14px; cursor:pointer; transition:.18s;
    text-align:left; line-height:1.4; display:flex; align-items:center; gap:9px; font-family: var(--font-ui); font-weight:500;
  }
  .quiz-btn:hover:not(:disabled){ background: var(--panel-2); border-color: var(--accent); transform: translateX(2px); }
  .quiz-btn.correct{ background: color-mix(in srgb, var(--correct) 22%, var(--card-bg)) !important; border-color: var(--correct) !important; color: var(--ink) !important; }
  .quiz-btn.wrong{ background: color-mix(in srgb, var(--incorrect) 22%, var(--card-bg)) !important; border-color: var(--incorrect) !important; color: var(--ink) !important; opacity:.75; }

  .pinyin-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:9px; }
  .pinyin-grid .quiz-btn{ justify-content:center; font-size:19px; padding:12px; font-family: var(--font-ui); font-weight:700; }
  .pinyin-grid .quiz-btn:last-child{ grid-column: span 2; }

  .words-list{ overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:2px; flex:1; }
  .word-item{ background: var(--card-bg); border:1px solid var(--border); border-radius: var(--r-md); padding:14px; transition: border-color .18s, transform .18s; }
  .word-item:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .word-header{ display:flex; align-items:center; gap:9px; margin-bottom:4px; }
  .word-hz{ font-size:25px; color: var(--ink); }
  .word-py{ font-size:14.5px; margin-bottom:5px; display:block; }
  .word-df{ font-size:13px; color: var(--ink-soft); line-height:1.5; display:block; }

  .toast{
    position:fixed; top: max(18px, env(safe-area-inset-top)); left:50%; transform: translateX(-50%) translateY(-120px);
    background: var(--accent); color: var(--on-accent); padding:11px 22px; border-radius:30px;
    font-size:13px; font-weight:800; box-shadow: var(--shadow-lg); transition: transform .32s cubic-bezier(.3,.9,.3,1); z-index:2000;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }
  .toast.error{ background: var(--incorrect); color:#fff8ea; }
  .toast.success{ background: var(--correct); color:#fff8ea; }

  /* ============================================================
     MOBILE — mise en page dédiée, sans impact sur la version PC
  ============================================================ */
  @media (max-width: 640px){
    html, body{
      width:100%;
      max-width:100%;
      height:100%;
      height:100dvh;
      overflow:hidden;
      overscroll-behavior:none;
    }

    body{
      position:fixed;
      inset:0;
    }

    /* L'écran de jeu devient une vraie vue d'app plein écran. */
    #gameScreen{
      --stage-width: calc(100vw - 20px);
      width:100vw;
      max-width:none;
      height:100dvh;
      min-height:100dvh;
      margin:0;
      padding:
        max(6px, env(safe-area-inset-top))
        0
        max(6px, env(safe-area-inset-bottom));
      justify-content:center;
      gap:0;
      overflow:hidden;
      overscroll-behavior:none;
    }

    /* Le bouton de thème reste sur l'accueil, mais ne recouvre pas le jeu. */
    body:has(#gameScreen.active) .theme-toggle{
      display:none;
    }

    .game-header{
      width:var(--stage-width);
      max-width:none;
      min-height:40px;
      padding:7px 8px;
      margin:0 auto 6px;
      border-radius:11px;
      gap:4px;
    }

    .game-stat{
      gap:4px;
      min-width:0;
    }
    .game-stat .stat-label{
      font-size:9px;
      letter-spacing:.35px;
    }
    .game-stat .stat-value{
      font-size:15px;
    }

    .reveal-panel{
      width:var(--stage-width);
      max-width:none;
      min-height:62px;
      height:62px;
      padding:6px 10px;
      margin:0 auto 6px;
      border-radius:11px;
      overflow:hidden;
    }
    .reveal-inner{ gap:3px; }
    .reveal-head{
      gap:8px;
      flex-wrap:nowrap;
      min-width:0;
    }
    .reveal-hanzi{
      font-size:25px;
      flex-shrink:0;
    }
    .reveal-meta{
      gap:8px;
      flex-wrap:nowrap;
      min-width:0;
    }
    .reveal-pinyin{
      font-size:14px;
      white-space:nowrap;
    }
    .reveal-panel .hsk-tag{
      padding:2px 6px;
      font-size:9px;
    }
    .reveal-def{
      margin-top:0;
      font-size:11px;
      line-height:1.18;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;
    }

    .board-wrapper{
      flex:0 0 auto;
      width:100%;
      min-height:0;
      padding:0;
      margin:0;
    }
    .board{
      width:var(--stage-width);
      height:var(--stage-width);
      max-width:none;
      max-height:none;
      margin:0 auto;
    }

    .grid-3x3{ gap:7px; }
    .grid-4x4{ gap:6px; }
    .grid-5x5{ gap:5px; }
    .grid-6x6{ gap:4px; }
    .grid-8x8{ gap:2px; }

    .card-face{
      border-radius:9px;
    }
    .card-front{
      box-shadow:0 2px 5px rgba(0,0,0,.22), inset 0 0 0 2px var(--card-bg), inset 0 0 0 4px color-mix(in srgb, var(--gold) 55%, transparent);
    }

    .game-footer{
      width:var(--stage-width);
      max-width:none;
      min-height:42px;
      gap:7px;
      margin:7px auto 0;
    }
    .game-footer .btn{
      min-height:42px;
      padding:8px 3px;
      border-radius:11px;
      font-size:12.5px;
    }

    /* Modales adaptées au même viewport verrouillé. */
    .modal-overlay{
      padding:max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    }
    .modal-content{
      max-height:calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      padding:16px;
      border-radius:18px;
    }
    .quiz-target{ font-size:42px; }
  }

  /* Téléphones très bas : on garde la grille large et on compresse uniquement l'UI. */
  @media (max-width: 640px) and (max-height: 700px){
    #gameScreen{
      padding-top:max(4px, env(safe-area-inset-top));
      padding-bottom:max(4px, env(safe-area-inset-bottom));
    }
    .game-header{
      min-height:36px;
      padding:5px 7px;
      margin-bottom:4px;
    }
    .game-stat .stat-label{ font-size:8.5px; }
    .game-stat .stat-value{ font-size:14px; }
    .reveal-panel{
      min-height:54px;
      height:54px;
      padding:4px 8px;
      margin-bottom:4px;
    }
    .reveal-hanzi{ font-size:22px; }
    .reveal-pinyin{ font-size:12.5px; }
    .reveal-def{
      font-size:10px;
      -webkit-line-clamp:2;
    }
    .game-footer{
      min-height:38px;
      margin-top:5px;
    }
    .game-footer .btn{
      min-height:38px;
      padding:6px 2px;
      font-size:12px;
    }
  }

  /* En paysage mobile, priorité à la hauteur disponible pour éviter tout débordement. */
  @media (max-width: 900px) and (orientation: landscape) and (pointer: coarse){
    #gameScreen{
      --stage-width:min(calc(100vw - 20px), calc(100dvh - 150px));
    }
    .game-header,
    .reveal-panel,
    .game-footer{
      width:var(--stage-width);
    }
    .reveal-panel{
      min-height:44px;
      height:44px;
      margin-bottom:4px;
    }
    .reveal-def{ -webkit-line-clamp:1; }
    .game-header{ margin-bottom:4px; }
    .game-footer{ margin-top:4px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important; scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

<button id="themeToggle" class="theme-toggle" type="button" aria-label="Changer de thème">

  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>

<!-- ÉCRAN D'ACCUEIL -->

  <div class="panel">

<script>
let dict = new Map();
let hskMap = new Map();
let wordPool = [];

const DICT_URL = 'cedict_ts.u8';
const HSK_URL = 'niveaux.csv';

let gameConfig = { size: 3, mode: 'classic', expert: false, timeMode: 'chrono', timerSec: 120, levels: [1,2,3] };
let cards = [];
let foundWordsData = [];
let flippedCards = [];
let lockBoard = false;
let pairsFound = 0;
let totalPairs = 0;
let timerInt = null;
let secondsElapsed = 0;
let triesCount = 0;
let hideTimeout = null;

let quizQueue = [];
let currentQuizStep = null;
let quizPair = [];

function initTheme(){
  applyTheme('light'); // Thème clair par défaut
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.setAttribute('aria-label', t === 'dark' ? 'Activer mode clair' : 'Activer mode sombre');
  const meta = document.getElementById('metaThemeColor');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#121014' : '#eef1e2');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

function getHskTagHtml(level) {
  if (!level || level < 1) return '';
  const label = level === 7 ? 'HSK 7-9' : `HSK ${level}`;
  return `<span class="hsk-tag lvl-${level}">${label}</span>`;
}

function applyToneDiacritic(syllable, toneNum) {
  if (toneNum === 5) return syllable;
  const toneMarks = {
    a: ['ā','á','ǎ','à'], e: ['ē','é','ě','è'], i: ['ī','í','ǐ','ì'],
    o: ['ō','ó','ǒ','ò'], u: ['ū','ú','ǔ','ù'], v: ['ǖ','ǘ','ǚ','ǜ'], ü: ['ǖ','ǘ','ǚ','ǜ']
  };
  syllable = syllable.replace(/v/g, 'ü');
  const vowels = ['a', 'o', 'e', 'i', 'u', 'ü'];

  for (let v of vowels) {
    if (syllable.includes(v)) {
      if(v === 'i' && syllable.includes('u')) v = 'u';
      else if(v === 'u' && syllable.includes('i')) v = 'i';
      return syllable.replace(v, toneMarks[v][toneNum - 1]);
    }
  }
  return syllable;
}

function numericToDiacriticPinyinStr(pinyinStr) {
  let parts = pinyinStr.split(' ');
  return parts.map(p => {
    let tone = p.match(/[1-5]/);
    if(!tone) return p.replace(/v/g, 'ü');
    return applyToneDiacritic(p.replace(/[1-5]/g, '').toLowerCase(), parseInt(tone[0]));
  }).join(' ');
}

function renderColoredPinyinHtml(pinyinStr) {
  if (!pinyinStr) return '';
  return pinyinStr.split(' ').map(p => {
    let toneMatch = p.match(/[1-5]/);
    let tone = toneMatch ? parseInt(toneMatch[0]) : 5;
    let clean = applyToneDiacritic(p.replace(/[1-5]/g, '').toLowerCase(), tone);
    return `<span class="py-syl tone${tone}">${clean}</span>`;
  }).join(' ');
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  setupUIEventListeners();
  loadDataFiles();
});

function setupUIEventListeners() {
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  const slTimer = document.getElementById('slTimer');
  const valTimer = document.getElementById('valTimer');
  slTimer.addEventListener('input', e => {
    let s = parseInt(e.target.value);
    let m = Math.floor(s/60);
    let sec = s%60;
    valTimer.textContent = `${m}m ${sec.toString().padStart(2,'0')}s`;
  });

  document.getElementById('selTimeMode').addEventListener('change', e => {
    document.getElementById('timerGroup').style.display = e.target.value === 'timer' ? 'flex' : 'none';
  });

  document.getElementById('selGrid').addEventListener('change', updateWordPool);

  document.querySelectorAll('.btn-hsk').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      updateWordPool();
    });
  });

  document.getElementById('btnStart').addEventListener('click', startGame);
  
  document.getElementById('btnRestart').addEventListener('click', () => {
    showToast("Plateau réinitialisé !", "success");
    stopTimer();
    startGame();
  });

  document.getElementById('btnQuit').addEventListener('click', () => {
    stopTimer();
    stopStageWidthWatch();
    switchScreen('setupScreen');
  });

  document.getElementById('btnFoundWords').addEventListener('click', () => showWordListModal(foundWordsData, "Mots trouvés"));

  document.getElementById('fileDict').addEventListener('change', e => readLocalFile(e, parseCedict));
  document.getElementById('fileHsk').addEventListener('change', e => readLocalFile(e, parseHSK));
}

async function loadDataFiles() {
  const statusDict = document.getElementById('statusDict');
  const statusHsk = document.getElementById('statusHsk');
  const manualUpload = document.getElementById('manualUpload');

  let dictOk = false;
  let hskOk = false;

  try {
    statusDict.textContent = "Dictionnaire : chargement…";
    const resDict = await fetch(DICT_URL);
    if (!resDict.ok) throw new Error(`HTTP ${resDict.status}`);
    const txtDict = await resDict.text();
    parseCedict(txtDict);
    dictOk = true;
  } catch (err) {
    statusDict.textContent = "Dictionnaire : import manuel";
    statusDict.classList.add('error');
  }

  try {
    statusHsk.textContent = "Niveaux HSK : chargement…";
    const resHsk = await fetch(HSK_URL);
    if (!resHsk.ok) throw new Error(`HTTP ${resHsk.status}`);
    const txtHsk = await resHsk.text();
    parseHSK(txtHsk);
    hskOk = true;
  } catch (err) {
    statusHsk.textContent = "Niveaux HSK : import manuel";
    statusHsk.classList.add('error');
  }

  if (!dictOk || !hskOk) {
    manualUpload.style.display = 'block';
  } else {
    manualUpload.style.display = 'none';
  }
}

function readLocalFile(event, parserFunc) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => parserFunc(e.target.result);
  reader.readAsText(file, 'utf-8');
}

function parseCedict(text) {
  const lines = text.split(/\r?\n/);
  dict.clear();
  for(let line of lines) {
    line = line.trim();
    if(!line || line.startsWith('#')) continue;

    let m = line.match(/^(\S+)\s+(\S+)\s+\[([^\]]+)\]\s+\/(.+)\/$/);
    if(m) {
      let simp = m[2];
      let pinyin = m[3];
      let defsStr = m[4];

      defsStr = defsStr.replace(/\[([a-zA-Z1-5\s:]+)\]/g, (match, p1) => {
        return '[' + numericToDiacriticPinyinStr(p1) + ']';
      });

      let defs = defsStr.split('/').filter(d => d.trim().length > 0);
      if(!dict.has(simp)) {
        dict.set(simp, { pinyin, defs });
      }
    }
  }
  const s = document.getElementById('statusDict');
  s.textContent = `Dictionnaire : OK (${dict.size})`;
  s.className = 'chip ready';
  checkReady();
}

function parseHSK(text) {
  const lines = text.split(/\r?\n/);
  hskMap.clear();
  for(let i=1; i<lines.length; i++){
    let l = lines[i].trim();
    if(!l) continue;
    let parts = l.split(/[,;]/);
    if(parts.length < 2) continue;

    let word = parts[0].trim();
    let val = parts[1].trim();
    let lvl = 0;

    if(/^\d+$/.test(val)) lvl = parseInt(val);
    else if(val === '7-9' || val === 'sept') lvl = 7;

    if(lvl >= 1 && lvl <= 7) hskMap.set(word, lvl);
  }
  const s = document.getElementById('statusHsk');
  s.textContent = `Niveaux HSK : OK (${hskMap.size})`;
  s.className = 'chip ready';
  checkReady();
}

function checkReady() {
  if(dict.size > 0 && hskMap.size > 0) {
    document.getElementById('manualUpload').style.display = 'none';
    updateWordPool();
  }
}

function updateWordPool() {
  gameConfig.levels = Array.from(document.querySelectorAll('.btn-hsk.active')).map(b => parseInt(b.dataset.lvl));
  wordPool = [];
  for(let [word, lvl] of hskMap.entries()) {
    if(gameConfig.levels.includes(lvl) && dict.has(word)) {
      wordPool.push(word);
    }
  }
  let btnStart = document.getElementById('btnStart');
  const size = parseInt(document.getElementById('selGrid').value) || 3;
  const needed = Math.floor((size*size)/2);
  
  const startLabel = `Démarrer (${wordPool.length} mots dispo)`;
  btnStart.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> ${startLabel}`;
  btnStart.disabled = wordPool.length < needed;

  const hint = document.getElementById('capacityHint');
  if (wordPool.length >= needed) {
    hint.className = 'capacity-hint ok';
    hint.textContent = `✓ ${wordPool.length} mots disponibles pour ${needed} paires`;
  } else {
    hint.className = 'capacity-hint bad';
    hint.textContent = `✗ Il faut ${needed} mots au moins pour cette grille (${wordPool.length} dispo)`;
  }
}

function startGame() {
  gameConfig.size = parseInt(document.getElementById('selGrid').value);
  gameConfig.mode = document.getElementById('selMode').value;
  gameConfig.expert = document.getElementById('chkExpert').checked;
  gameConfig.timeMode = document.getElementById('selTimeMode').value;
  gameConfig.timerSec = parseInt(document.getElementById('slTimer').value);

  const totalCards = gameConfig.size * gameConfig.size;
  totalPairs = Math.floor(totalCards / 2);

  if(wordPool.length < totalPairs) {
    showToast("Pas assez de mots disponibles !", "error");
    return;
  }

  let shuffledPool = [...wordPool].sort(() => 0.5 - Math.random());
  let selectedWords = shuffledPool.slice(0, totalPairs);

  cards = [];
  selectedWords.forEach((word, index) => {
    cards.push({ id: `a_${index}`, word: word, state: 'hidden', logicIndex: 0, isEmpty: false });
    cards.push({ id: `b_${index}`, word: word, state: 'hidden', logicIndex: 0, isEmpty: false });
  });

  if (totalCards % 2 !== 0) {
    cards.push({ id: `empty`, word: '∅', state: 'hidden', logicIndex: 0, isEmpty: true });
  }

  cards.sort(() => 0.5 - Math.random());
  cards.forEach((c, i) => c.logicIndex = i);

  pairsFound = 0;
  triesCount = 0;
  if(hideTimeout) {
    clearTimeout(hideTimeout);
    hideTimeout = null;
  }
  foundWordsData = [];
  flippedCards = [];
  lockBoard = false;

  hidePreviewBanner();
  setupGridUI();
  updateScoreUI();
  startTimer();

  switchScreen('gameScreen');
  requestAnimationFrame(syncStageWidth);
}

let stageResizeObserver = null;
function syncStageWidth() {
  const board = document.getElementById('board');
  if (!board) return;
  const w = board.getBoundingClientRect().width;
  if (w > 0) document.documentElement.style.setProperty('--stage-width', w + 'px');
}
function watchStageWidth() {
  const board = document.getElementById('board');
  if (!board) return;
  if (window.ResizeObserver) {
    if (stageResizeObserver) stageResizeObserver.disconnect();
    stageResizeObserver = new ResizeObserver(syncStageWidth);
    stageResizeObserver.observe(board);
  } else {
    window.addEventListener('resize', syncStageWidth);
  }
  syncStageWidth();
}
function stopStageWidthWatch() {
  if (stageResizeObserver) { stageResizeObserver.disconnect(); stageResizeObserver = null; }
  window.removeEventListener('resize', syncStageWidth);
}

function setupGridUI() {
  const board = document.getElementById('board');
  board.className = `board grid-${gameConfig.size}x${gameConfig.size}`;
  board.innerHTML = '';

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.classList.add('card');
    if(card.isEmpty) el.classList.add('empty-trap');
    el.dataset.logicIndex = i;

    let lenClass = 'len-1';
    if (card.word.length === 2) lenClass = 'len-2';
    else if (card.word.length === 3) lenClass = 'len-3';
    else if (card.word.length === 4) lenClass = 'len-4';
    else if (card.word.length > 4) lenClass = 'len-long';

    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front"></div>
        <div class="card-face card-back hanzi ${lenClass}">${card.word}</div>
      </div>
    `;
    el.addEventListener('click', () => handleCardClick(i));
    board.appendChild(el);
  });
  syncStageWidth();
}

function handleCardClick(logicIndex) {
  let cardData = cards[logicIndex];

  if (cardData.state !== 'hidden' || flippedCards.includes(cardData)) return;

  hidePreviewBanner();

  if (hideTimeout) {
    hideFlippedCards();
  }

  if (lockBoard) return;

  let domCard = document.querySelector(`.card[data-logic-index="${logicIndex}"]`);
  domCard.classList.add('flipped');

  if (cardData.isEmpty) {
    lockBoard = true;
    triesCount++;
    updateScoreUI();
    showToast("Case vide !", "error");
    setTimeout(() => {
      domCard.classList.remove('flipped');
      lockBoard = false;
      if (flippedCards.length === 1) {
        let firstCardDom = document.querySelector(`.card[data-logic-index="${flippedCards[0].logicIndex}"]`);
        if (firstCardDom) firstCardDom.classList.remove('flipped');
        flippedCards = [];
      }
    }, 800);
    return;
  }

  flippedCards.push(cardData);

  if (flippedCards.length === 2) {
    triesCount++;
    updateScoreUI();

    let [c1, c2] = flippedCards;

    if (c1.word === c2.word) {
      lockBoard = true;
      if (gameConfig.mode === 'classic') {
          quizPair = [c1, c2];
          markPairAsFound();
      } else {
          setTimeout(() => {
            quizPair = [c1, c2];
            buildQuizQueue(c1.word);
            processQuizQueue();
          }, 400);
      }
    } else {
      hideTimeout = setTimeout(hideFlippedCards, 1300);
    }
  }
}

function hideFlippedCards() {
  if (hideTimeout) {
    clearTimeout(hideTimeout);
    hideTimeout = null;
  }

  if (flippedCards.length === 2) {
    let [c1, c2] = flippedCards;
    let dom1 = document.querySelector(`.card[data-logic-index="${c1.logicIndex}"]`);
    let dom2 = document.querySelector(`.card[data-logic-index="${c2.logicIndex}"]`);

    if(dom1) dom1.classList.remove('flipped');
    if(dom2) dom2.classList.remove('flipped');
  }

  flippedCards = [];
  lockBoard = false;
}

function showPreviewBanner(word) {
  const dictEntry = dict.get(word);
  if (!dictEntry) return;

  const banner = document.getElementById('wordPreviewBanner');
  const lvl = hskMap.get(word);

  document.getElementById('wpHanzi').textContent = word;
  document.getElementById('wpPinyin').innerHTML = renderColoredPinyinHtml(dictEntry.pinyin);
  document.getElementById('wpHsk').innerHTML = getHskTagHtml(lvl);
  document.getElementById('wpDef').textContent = dictEntry.defs.join(' / ');

  banner.classList.add('active');
}

function hidePreviewBanner() {
  const banner = document.getElementById('wordPreviewBanner');
  if (banner) banner.classList.remove('active');
}

function markPairAsFound() {
  let [c1, c2] = quizPair;
  c1.state = 'matched';
  c2.state = 'matched';

  let dom1 = document.querySelector(`.card[data-logic-index="${c1.logicIndex}"]`);
  let dom2 = document.querySelector(`.card[data-logic-index="${c2.logicIndex}"]`);

  dom1.classList.add('matched');
  dom2.classList.add('matched');

  let dictEntry = dict.get(c1.word);
  dictEntry.hanzi = c1.word;
  dictEntry.level = hskMap.get(c1.word);
  foundWordsData.push(dictEntry);

  dom1.onclick = (e) => { e.stopPropagation(); showWordListModal([dictEntry], ""); };
  dom2.onclick = (e) => { e.stopPropagation(); showWordListModal([dictEntry], ""); };

  showPreviewBanner(c1.word);

  pairsFound++;
  updateScoreUI();

  flippedCards = [];
  lockBoard = false;

  if(pairsFound === totalPairs) {
    stopTimer();
    setTimeout(() => {
      showToast("Félicitations, vous avez gagné !", "success");
      showWordListModal(foundWordsData, "🏮 Victoire ! Mots découverts");
    }, 500);
  }
}

function buildQuizQueue(word) {
  quizQueue = [];
  let m = gameConfig.mode;
  if(m === 'classic') return;

  if(m === 'def' || m === 'both') {
    quizQueue.push({ type: 'def', word: word });
  }
  if(m === 'pinyin' || m === 'both') {
    let chars = Array.from(word);
    let pinyinSyllables = dict.get(word).pinyin.split(' ');
    if(pinyinSyllables.length !== chars.length) pinyinSyllables = chars.map(c => dict.get(c)?.pinyin.split(' ')[0] || "xx1");

    chars.forEach((c, idx) => {
      quizQueue.push({ type: 'pinyin', word: word, char: c, pinyinObj: pinyinSyllables[idx], charIdx: idx, totalChars: chars.length });
    });
  }
}

function processQuizQueue() {
  if (quizQueue.length === 0) {
    closeModal('modalQuiz');
    markPairAsFound();
    return;
  }
  currentQuizStep = quizQueue.shift();

  if(currentQuizStep.type === 'def') {
    renderDefQuiz(currentQuizStep.word);
  } else if (currentQuizStep.type === 'pinyin') {
    renderPinyinQuiz(currentQuizStep.word, currentQuizStep.char, currentQuizStep.pinyinObj, currentQuizStep.charIdx, currentQuizStep.totalChars);
  }
}

function renderDefQuiz(word) {
  const target = document.getElementById('quizTarget');
  const subtitle = document.getElementById('quizSubtitle');
  const optionsContainer = document.getElementById('quizOptions');

  const currentLvl = hskMap.get(word);
  target.textContent = word;
  subtitle.textContent = "Choisissez la bonne définition :";
  optionsContainer.className = "quiz-options";

  let correctDef = dict.get(word).defs.join(' / ');

  let otherWords = wordPool.filter(w => w !== word);
  otherWords.sort(() => 0.5 - Math.random());

  let wrongOptions = otherWords.slice(0, 4).map(w => ({
    text: dict.get(w).defs.join(' / '),
    level: hskMap.get(w),
    correct: false
  }));

  let options = [
    { text: correctDef, level: currentLvl, correct: true },
    ...wrongOptions
  ];
  options.sort(() => 0.5 - Math.random());

  optionsContainer.innerHTML = '';
  options.forEach(opt => {
    let btn = document.createElement('button');
    btn.className = 'quiz-btn';
    btn.dataset.correct = opt.correct;
    btn.innerHTML = `${getHskTagHtml(opt.level)} <span>${opt.text}</span>`;
    btn.onclick = () => handleQuizAnswer(btn, opt.correct);
    optionsContainer.appendChild(btn);
  });

  document.getElementById('modalQuiz').classList.add('active');
}

function renderPinyinQuiz(word, char, rawPinyin, charIdx, totalChars) {
  const target = document.getElementById('quizTarget');
  const subtitle = document.getElementById('quizSubtitle');
  const optionsContainer = document.getElementById('quizOptions');

  target.textContent = char;
  subtitle.textContent = `Mot : ${word} (${charIdx+1}/${totalChars}). Quel est le bon ton ?`;
  optionsContainer.className = "quiz-options pinyin-grid";

  let baseSyllable = rawPinyin.replace(/[1-5]/g, '').toLowerCase();
  let correctTone = parseInt(rawPinyin.match(/[1-5]/) ? rawPinyin.match(/[1-5]/)[0] : 5);

  let options = [];
  for(let i=1; i<=5; i++) {
    options.push({ text: applyToneDiacritic(baseSyllable, i), correct: (i === correctTone) });
  }

  optionsContainer.innerHTML = '';
  options.forEach(opt => {
    let btn = document.createElement('button');
    btn.className = 'quiz-btn';
    btn.dataset.correct = opt.correct;
    btn.textContent = opt.text;
    btn.onclick = () => handleQuizAnswer(btn, opt.correct);
    optionsContainer.appendChild(btn);
  });

  document.getElementById('modalQuiz').classList.add('active');
}

function handleQuizAnswer(btnElement, isCorrect) {
  let allBtns = document.getElementById('quizOptions').querySelectorAll('.quiz-btn');

  if (isCorrect) {
    allBtns.forEach(b => b.disabled = true);
    btnElement.classList.add('correct');
    setTimeout(() => {
      processQuizQueue();
    }, 1500);
  } else {
    btnElement.classList.add('wrong');
    btnElement.disabled = true;

    if (gameConfig.expert) {
      allBtns.forEach(b => b.disabled = true);
      allBtns.forEach(b => { if(b.dataset.correct === 'true') b.classList.add('correct'); });

      setTimeout(() => {
        closeModal('modalQuiz');
        handleQuizFailure();
      }, 2000);
    }
  }
}

function handleQuizFailure() {
  hideFlippedCards();

  if (gameConfig.expert) {
    showToast("Erreur ! Les cartes se cachent et se déplacent...", "error");
    document.getElementById('board').classList.add('shake');
    setTimeout(() => document.getElementById('board').classList.remove('shake'), 500);

    let hiddenCards = cards.filter(c => c.state === 'hidden' && c !== quizPair[0] && c !== quizPair[1]);
    if(hiddenCards.length >= 2) {
      hiddenCards.sort(() => 0.5 - Math.random());
      let t1 = hiddenCards[0], t2 = hiddenCards[1];

      let idxC1 = quizPair[0].logicIndex;
      let idxC2 = quizPair[1].logicIndex;
      let idxT1 = t1.logicIndex;
      let idxT2 = t2.logicIndex;

      cards[idxC1] = t1; cards[idxT1] = quizPair[0];
      cards[idxC2] = t2; cards[idxT2] = quizPair[1];

      cards[idxC1].logicIndex = idxC1; cards[idxT1].logicIndex = idxT1;
      cards[idxC2].logicIndex = idxC2; cards[idxT2].logicIndex = idxT2;

      reRenderCardDOM(idxC1); reRenderCardDOM(idxT1);
      reRenderCardDOM(idxC2); reRenderCardDOM(idxT2);
    }
  }
}

function reRenderCardDOM(logicIndex) {
  let domCard = document.querySelector(`.card[data-logic-index="${logicIndex}"]`);
  let backFace = domCard.querySelector('.card-back');
  backFace.textContent = cards[logicIndex].word;
}

function showWordListModal(wordsArray, title) {
  const listTitleEl = document.getElementById('listTitle');
  if (title) {
    listTitleEl.textContent = title;
    listTitleEl.style.display = 'block';
  } else {
    listTitleEl.style.display = 'none'; 
  }

  const modalContentEl = document.querySelector('#modalList .modal-content');
  modalContentEl.classList.toggle('victory', /victoire/i.test(title || ''));

  const content = document.getElementById('listContent');
  content.innerHTML = '';

  if(wordsArray.length === 0) {
    content.innerHTML = '<div style="text-align:center; color:var(--ink-soft); padding: 24px;">Aucun mot trouvé pour le moment.</div>';
  }

  wordsArray.forEach(w => {
    let hanzi = w.hanzi || "Mot";
    let lvl = w.level || hskMap.get(hanzi) || 0;
    let pinyinHtml = renderColoredPinyinHtml(w.pinyin);
    let defs = w.defs.join('<br> • ');

    let div = document.createElement('div');
    div.className = 'word-item';
    div.innerHTML = `
      <div class="word-header">
        <span class="word-hz hanzi">${hanzi}</span>
        ${getHskTagHtml(lvl)}
      </div>
      <span class="word-py">${pinyinHtml}</span>
      <span class="word-df">• ${defs}</span>
    `;
    content.appendChild(div);
  });

  document.getElementById('modalList').classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateScoreUI() {
  document.getElementById('uiScore').textContent = `${pairsFound} / ${totalPairs}`;
  document.getElementById('uiTries').textContent = triesCount;
}

function startTimer() {
  stopTimer();
  let timeLabel = document.getElementById('timeLabel');
  let uiTime = document.getElementById('uiTime');

  if (gameConfig.timeMode === 'free') {
    if(timeLabel) timeLabel.textContent = "Mode :";
    if(uiTime) uiTime.textContent = "Libre";
    return;
  }

  if(timeLabel) timeLabel.textContent = "Temps :";

  if (gameConfig.timeMode === 'chrono') {
    secondsElapsed = 0;
    if(uiTime) uiTime.textContent = "00:00";
    timerInt = setInterval(() => {
      secondsElapsed++;
      let m = Math.floor(secondsElapsed/60).toString().padStart(2,'0');
      let s = (secondsElapsed%60).toString().padStart(2,'0');
      if(uiTime) uiTime.textContent = `${m}:${s}`;
    }, 1000);
  } else if (gameConfig.timeMode === 'timer') {
    secondsElapsed = gameConfig.timerSec;
    updateTimerDisplay();
    timerInt = setInterval(() => {
      secondsElapsed--;
      updateTimerDisplay();
      if(secondsElapsed <= 0) {
        stopTimer();
        lockBoard = true;
        showToast("Temps écoulé !", "error");
        setTimeout(() => showWordListModal(foundWordsData, "Fin du temps. Mots découverts :"), 1000);
      }
    }, 1000);
  }
}

function updateTimerDisplay() {
  let uiTime = document.getElementById('uiTime');
  if(!uiTime) return;
  let m = Math.floor(secondsElapsed/60).toString().padStart(2,'0');
  let s = (secondsElapsed%60).toString().padStart(2,'0');
  uiTime.textContent = `${m}:${s}`;
  if(secondsElapsed <= 10) uiTime.style.color = "var(--incorrect)";
  else uiTime.style.color = "var(--ink)";
}

function stopTimer() {
  if(timerInt) clearInterval(timerInt);
  let uiTime = document.getElementById('uiTime');
  if(uiTime) uiTime.style.color = "var(--ink)";
}
</script>
